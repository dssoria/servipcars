<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SERVIPCARS.A</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="container py-4">
            <div class="text-center mb-2">
                <h5 class="display-7 fw-bold text-primary">
                    <i class="fas fa-taxi"></i>SERVIPCARS.A
                </h5>
                <div class="mt-2">
                    <!-- Número de WhatsApp clickeable -->
                    <a href="https://wa.me/593991874475" target="_blank" id="whatsappLink" class="text-decoration-none d-inline-flex align-items-center gap-2">
                        <i class="fas fa-phone-alt text-success"></i>
                        <span class="fw-semibold text-dark">0991874475</span>
                    </a>

                    <!-- Texto de ayuda que desaparece completamente -->
                    <div id="ayudaWhatsApp" class="text-muted small mt-1" style="display: none;">
                        📲 Toca el número para contactar por WhatsApp.
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">

                    <!-- Origen -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">📍 De</label>
                        <div class="input-group">
                            <input type="text" id="origen" class="form-control" placeholder="¿Dónde te encuentras?">
                            <button class="btn btn-outline-danger btn-clear" id="clearOrigen" title="Borrar">
                                <i class="fas fa-times"></i>
                            </button>
                            <button class="btn btn-outline-success" id="btnMiUbicacion" title="Mi ubicación">
                                <i class="fas fa-location-crosshairs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Destino -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">🏁 A</label>
                        <div class="input-group">
                            <input type="text" id="destino" class="form-control" placeholder="¿A dónde te diriges?">
                            <button class="btn btn-outline-danger btn-clear" id="clearDestino" title="Borrar">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Método de pago -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">💵 Método de pago</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="metodoPago" id="efectivo" value="Efectivo" checked>
                                <label class="form-check-label" for="efectivo"><i class="fas fa-money-bill-wave"></i> Efectivo</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="metodoPago" id="transferencia" value="Transferencia">
                                <label class="form-check-label" for="transferencia"><i class="fas fa-bank"></i> Transferencia</label>
                            </div>
                        </div>
                    </div>

                    <!-- Mapa -->
                    <div id="map" class="mb-4"></div>

                    <!-- Información -->
                    <div id="info" class="info-box p-3 border d-none">
                        <div class="row g-3">
                            <div class="col-12 col-sm-4">
                                <strong>Distancia:</strong><br><span id="dist" class="text-muted">—</span>
                            </div>
                            <div class="col-12 col-sm-4">
                                <strong>Tiempo aprox:</strong><br><span id="time" class="text-muted">—</span>
                            </div>
                            <div class="col-12 col-sm-4">
                                <strong>Precio estimado:</strong><br>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" id="costoInput" class="form-control" step="0.50" value="2.50" min="2.50">
                                    <button class="btn btn-outline-success btn-confirm-cost d-none" id="btnConfirmarCosto" title="Confirmar costo">
                                        <i class="fas fa-check"></i>
                                    </button>
                                </div>
                                <small id="infoHora" class="hora-pico"></small>
                            </div>
                        </div>
                    </div>

                    <button id="btnEnviar" class="btn btn-primary w-100 py-3 mt-3 fw-bold">
                        <i class="fas fa-paper-plane"></i> Enviar por WhatsApp
                    </button>
                </div>
            </div>
        </div>

        <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBg4RnlXz7vmvsu_tm7jVUdQFA1y5kRqqU&libraries=places&callback=initMap&loading=async">
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
    </body>

</html>
